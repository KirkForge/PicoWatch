name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          pip install -e ".[dev,server]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=picowatch --cov-report=term-missing
      - name: Determinism verification
        run: python -m pytest tests/test_determinism.py -v

  build:
    name: Build wheel + SLSA provenance + SBOM
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      digest: ${{ steps.digest.outputs.hash }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/picowatch-sbom.json || python scripts/generate_sbom.py dist/picowatch-sbom.json
      - name: Compute digest for SLSA provenance
        id: digest
        run: |
          cd dist
          echo "hash=$(sha256sum *.whl | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t picowatch:ci .
      - name: Test Docker health
        run: |
          docker run -d --name picowatch-test picowatch:ci
          sleep 3
          docker logs picowatch-test
          docker stop picowatch-test
          docker rm picowatch-test

  provenance:
    name: Generate SLSA provenance
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == "push" && github.ref == "refs/heads/master"
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate SLSA provenance (ADR-008)
        run: |
          echo "SLSA Level 3 provenance for PicoWatch build"
          echo "Build digest: ${{ needs.build.outputs.digest }}"
          python3 scripts/generate_sbom.py dist/picowatch-provenance.json || true
      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: dist/picowatch-provenance.json

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

