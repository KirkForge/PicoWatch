[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picowatch"
version = "1.0.0"
description = "PicoWatch — LLM defender with telemetry: prompt injection detection, output validation, and observability"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE*", "COMMERCIAL-LICENSE.md"]
requires-python = ">=3.10"
authors = [{name = "Henrik Kirk", email = "kirk@kirkforge.dev"}]
maintainers = [{name = "KirkForge", email = "kirk@kirkforge.dev"}]
keywords = [
    "llm",
    "security",
    "prompt-injection",
    "output-validation",
    "telemetry",
    "observability",
    "opentelemetry",
    "defense",
    "shogun",
    "picowatch",
    "supply-chain",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "jsonschema>=4.0",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
picowatch = "picowatch.cli:main"


[project.urls]
Homepage = "https://github.com/KirkForge/PicoWatch"
Documentation = "https://github.com/KirkForge/PicoWatch#readme"
Repository = "https://github.com/KirkForge/PicoWatch"
Issues = "https://github.com/KirkForge/PicoWatch/issues"
Changelog = "https://github.com/KirkForge/PicoWatch/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/KirkForge/PicoWatch/releases"
"Source Code" = "https://github.com/KirkForge/PicoWatch"
"Bug Tracker" = "https://github.com/KirkForge/PicoWatch/issues"
Commercial = "https://github.com/KirkForge/PicoShogun"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picowatch.rules" = ["prompt_injection/*.yaml", "prompt_injection/*.yml", "output_policy/*.yaml", "output_policy/*.yml"]
picowatch = ["py.typed"]



[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
